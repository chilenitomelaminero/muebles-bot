name: Publicacion Automatica Chilenito Melaminero

on:
  workflow_dispatch: # Esto te permite probarlo manualmente con el botón "Run workflow"
  schedule:
    - cron: '0 14 * * *' # Se ejecuta automáticamente todos los días a las 9:00 AM (hora Perú)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar librerias necesarias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar el Bot del Chilenito
        env:
          # Conectamos las llaves de GitHub Secrets con el código de Python
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
        run: python main.py

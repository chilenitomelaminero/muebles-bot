name: Publicador Muebles Bot

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 14 * * *'

jobs:
  publicar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Instalar dependencias
        run: |
          pip install requests
          pip install Pillow
          pip install google-api-python-client
          pip install google-auth
          pip install google-generativeai
      
      - name: Publicar en Facebook e Instagram
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_INSTAGRAM_ID: ${{ secrets.META_INSTAGRAM_ID }}
          MI_API_KEY_SECRETA: ${{ secrets.MI_API_KEY_SECRETA }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py
